<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Spatial Intelligence Dashboard</title>
    
    <!-- Leaflet & Tailwind (Updated to CDN) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f172a;
            color: #e2e8f0;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        /* Leaflet Overrides for Dark Theme */
        .leaflet-control-zoom a {
            background: rgba(15, 23, 42, 0.8) !important;
            color: #38bdf8 !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            backdrop-filter: blur(8px);
        }
        .leaflet-control-zoom a:hover {
            background: rgba(30, 41, 59, 0.9) !important;
        }
        .leaflet-container .leaflet-control-attribution {
            background: rgba(0,0,0,0.5);
            color: #94a3b8;
        }
        .leaflet-container .leaflet-control-attribution a {
            color: #38bdf8;
        }

        /* Toggle Switch */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #38bdf8;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #38bdf8;
        }
        .toggle-checkbox:disabled + .toggle-label {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            margin-top: -4px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* UI Animations */
        .sidebar-transition {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Header -->
    <header class="glass-panel absolute top-4 left-1/2 transform -translate-x-1/2 z-[1000] px-6 py-3 rounded-full flex items-center gap-6 w-11/12 max-w-4xl">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-green-400 rounded-full animate-pulse shadow-[0_0_10px_#4ade80]"></div>
            <h1 class="text-lg md:text-xl font-bold tracking-wide text-white"><span class="text-sky-400">Geo</span>Dash</h1>
        </div>
        <div class="hidden md:flex gap-4 text-sm text-slate-300 ml-auto font-medium">
            <div class="flex flex-col items-center"><span class="text-sky-400 text-lg font-bold" id="stat-layers">12</span>Layers</div>
            <div class="w-px h-8 bg-slate-600"></div>
            <div class="flex flex-col items-center"><span class="text-sky-400 text-lg font-bold" id="stat-region">MH, India</span>Region</div>
        </div>
        <button id="toggle-sidebar" class="md:hidden ml-auto text-sky-400 hover:text-white transition">
            <i class="fas fa-bars text-xl"></i>
        </button>
    </header>

    <!-- Sidebar (Layer Manager) -->
    <aside id="sidebar" class="glass-panel sidebar-transition absolute top-20 left-4 bottom-4 w-80 z-[1000] rounded-2xl flex flex-col -translate-x-full md:translate-x-0">
        <div class="p-5 border-b border-white/10 flex justify-between items-center">
            <h2 class="text-lg font-semibold text-white"><i class="fas fa-layer-group text-sky-400 mr-2"></i>Layer Control</h2>
            <button id="close-sidebar" class="md:hidden text-gray-400 hover:text-white"><i class="fas fa-times"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto p-5 space-y-6" id="layer-groups">
            <!-- Layers will be dynamically injected here -->
        </div>
    </aside>

    <!-- Attribute Inspector Card (Slide-in) -->
    <div id="attribute-panel" class="glass-panel sidebar-transition absolute top-20 right-4 bottom-4 w-80 lg:w-96 z-[1000] rounded-2xl translate-x-[120%] flex flex-col shadow-2xl">
        <div class="p-5 border-b border-white/10 bg-slate-800/50 rounded-t-2xl flex justify-between items-center">
            <h3 class="text-lg font-semibold text-sky-400"><i class="fas fa-table mr-2"></i>Feature Properties</h3>
            <button id="close-attr" class="text-gray-400 hover:text-white transition"><i class="fas fa-times text-lg"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto p-0">
            <div id="attr-content" class="w-full">
                <p class="p-5 text-gray-400 text-sm">Select a feature on the map to inspect its attributes.</p>
            </div>
        </div>
    </div>

    <!-- External Leaflet Library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Original Data Imports -->
    <!-- We assume these files exist in the same directory structure as the user's local setup -->
    <script src="data/adminareas_0.js"></script>
    <script src="data/Clip_1.js"></script>
    <script src="data/landuse_2.js"></script>
    <script src="data/pois_3.js"></script>
    <script src="data/railways_4.js"></script>
    <script src="data/roads_5.js"></script>
    <script src="data/traffica_6.js"></script>
    <script src="data/traffic_7.js"></script>
    <script src="data/transporta_8.js"></script>
    <script src="data/transport_9.js"></script>
    <script src="data/Water_10.js"></script>
    <script src="data/waterways_11.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            // 1. Initialize Map
            const map = L.map('map', {
                zoomControl: false,
                maxZoom: 28,
                minZoom: 1
            }).fitBounds([[16.747074560962762,73.72082968676004],[18.559040228949886,77.06213206238967]]);
            
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // Dark Basemap (CartoDB Dark Matter)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 20
            }).addTo(map);

            // UI State
            const state = {
                layers: {},
                layerDefinitions: [
                    { id: 'Clip_1', varName: 'json_Clip_1', name: 'Study Area Clip', group: 'Boundaries', type: 'polygon', color: '#85b66f', zIndex: 401 },
                    { id: 'adminareas_0', varName: 'json_adminareas_0', name: 'Admin Areas', group: 'Boundaries', type: 'polygon', color: '#d5b43c', zIndex: 400 },
                    
                    { id: 'Water_10', varName: 'json_Water_10', name: 'Water Bodies', group: 'Environment', type: 'polygon', color: '#7d8b8f', zIndex: 410 },
                    { id: 'waterways_11', varName: 'json_waterways_11', name: 'Waterways', group: 'Environment', type: 'line', color: '#beb297', zIndex: 411 },
                    { id: 'landuse_2', varName: 'json_landuse_2', name: 'Land Use', group: 'Environment', type: 'polygon', color: '#beb297', zIndex: 402 },
                    
                    { id: 'roads_5', varName: 'json_roads_5', name: 'Roads', group: 'Infrastructure', type: 'line', color: '#e77148', zIndex: 405 },
                    { id: 'railways_4', varName: 'json_railways_4', name: 'Railways', group: 'Infrastructure', type: 'line', color: '#becf50', zIndex: 404 },
                    { id: 'transport_9', varName: 'json_transport_9', name: 'Transport Points', group: 'Infrastructure', type: 'point', color: '#a47158', zIndex: 409 },
                    { id: 'transporta_8', varName: 'json_transporta_8', name: 'Transport Areas', group: 'Infrastructure', type: 'polygon', color: '#729b6f', zIndex: 408 },
                    { id: 'traffic_7', varName: 'json_traffic_7', name: 'Traffic Points', group: 'Infrastructure', type: 'point', color: '#8d5a99', zIndex: 407 },
                    { id: 'traffica_6', varName: 'json_traffica_6', name: 'Traffic Areas', group: 'Infrastructure', type: 'polygon', color: '#ff9e17', zIndex: 406 },
                    
                    { id: 'pois_3', varName: 'json_pois_3', name: 'Points of Interest', group: 'POIs', type: 'point', color: '#e5b636', zIndex: 403 }
                ]
            };

            const attrPanel = document.getElementById('attribute-panel');
            const attrContent = document.getElementById('attr-content');
            
            function openAttributePanel(feature, layerName) {
                const props = feature.properties;
                if (!props) return;

                let html = `<div class="bg-slate-800/80 px-4 py-2 text-xs font-semibold tracking-wider text-sky-300 uppercase border-b border-white/10">${layerName}</div>`;
                html += '<table class="w-full text-left text-sm">';
                
                let hasData = false;
                for (let key in props) {
                    if (props[key] !== null && props[key] !== '' && props[key] !== 'NaN') {
                        hasData = true;
                        html += `
                        <tr class="border-b border-white/5 hover:bg-white/5 transition-colors">
                            <th class="py-3 px-4 text-gray-400 font-medium w-1/3 align-top">${key}</th>
                            <td class="py-3 px-4 text-white break-words">${props[key]}</td>
                        </tr>`;
                    }
                }
                html += '</table>';

                if (!hasData) {
                    html += '<div class="p-5 text-gray-400 text-sm italic">No attributes available for this feature.</div>';
                }

                attrContent.innerHTML = html;
                attrPanel.classList.remove('translate-x-[120%]');
                attrPanel.classList.add('translate-x-0');
            }

            document.getElementById('close-attr').addEventListener('click', () => {
                attrPanel.classList.add('translate-x-[120%]');
                attrPanel.classList.remove('translate-x-0');
            });

            function getStyle(def) {
                let style = { opacity: 1, interactive: true };
                if (def.type === 'polygon') {
                    style = { ...style, color: '#232323', weight: 1, fill: true, fillOpacity: 0.8, fillColor: def.color };
                } else if (def.type === 'line') {
                    style = { ...style, color: def.color, weight: 2, fillOpacity: 0 };
                }
                return style;
            }

            function getPointStyle(def, feature) {
                return {
                    radius: 5,
                    fillColor: def.color,
                    color: "#232323",
                    weight: 1,
                    opacity: 1,
                    fillOpacity: 0.8,
                    interactive: true
                };
            }

            // Group structure for UI
            const groupedLayers = { 'Boundaries': [], 'Environment': [], 'Infrastructure': [], 'POIs': [] };

            state.layerDefinitions.forEach(def => {
                // Ensure data variable exists on window (from local script tags)
                if (window[def.varName]) {
                    map.createPane(`pane_${def.id}`);
                    map.getPane(`pane_${def.id}`).style.zIndex = def.zIndex;
                    map.getPane(`pane_${def.id}`).style['mix-blend-mode'] = 'normal';

                    const layerArgs = {
                        pane: `pane_${def.id}`,
                        onEachFeature: (feature, layer) => {
                            layer.on('click', L.DomEvent.stop); // Prevent map click from instantly firing
                            layer.on('click', () => openAttributePanel(feature, def.name));
                        },
                        style: () => getStyle(def)
                    };

                    if (def.type === 'point') {
                        layerArgs.pointToLayer = (feature, latlng) => L.circleMarker(latlng, getPointStyle(def, feature));
                    }

                    const geoLayer = L.geoJson(window[def.varName], layerArgs);
                    
                    // Add to map immediately for this demo
                    geoLayer.addTo(map);
                    state.layers[def.id] = geoLayer;
                    groupedLayers[def.group].push(def);
                }
            });

            const sidebarContainer = document.getElementById('layer-groups');
            let sidebarHTML = '';

            for (const [groupName, layers] of Object.entries(groupedLayers)) {
                if (layers.length === 0) continue;
                
                let groupHtml = `
                <div class="bg-black/20 rounded-xl overflow-hidden border border-white/5">
                    <div class="px-4 py-3 bg-slate-800/40 border-b border-white/5 text-sm font-semibold text-sky-400 uppercase tracking-widest">${groupName}</div>
                    <div class="p-4 space-y-4">
                `;

                layers.forEach(def => {
                    groupHtml += `
                    <div class="flex flex-col gap-2">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <span class="w-3 h-3 rounded-full shadow-sm" style="background-color: ${def.color};"></span>
                                <span class="text-sm text-gray-200">${def.name}</span>
                            </div>
                            <!-- Toggle Switch -->
                            <div class="relative inline-block w-10 h-5 align-middle select-none transition duration-200 ease-in">
                                <input type="checkbox" name="toggle_${def.id}" id="toggle_${def.id}" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 border-slate-700 appearance-none cursor-pointer z-10" checked/>
                                <label for="toggle_${def.id}" class="toggle-label block overflow-hidden h-5 rounded-full bg-slate-700 cursor-pointer"></label>
                            </div>
                        </div>
                        <!-- Opacity Slider -->
                        <div class="flex items-center gap-2 px-6">
                            <i class="fas fa-eye-slash text-[10px] text-gray-500"></i>
                            <input type="range" id="opacity_${def.id}" min="0" max="100" value="80" class="w-full">
                            <i class="fas fa-eye text-[10px] text-gray-400"></i>
                        </div>
                    </div>
                    `;
                });

                groupHtml += `</div></div>`;
                sidebarHTML += groupHtml;
            }

            sidebarContainer.innerHTML = sidebarHTML;

            Object.keys(state.layers).forEach(layerId => {
                const toggle = document.getElementById(`toggle_${layerId}`);
                const slider = document.getElementById(`opacity_${layerId}`);
                const layerGroup = state.layers[layerId];

                if(toggle) {
                    toggle.addEventListener('change', (e) => {
                        if(e.target.checked) {
                            map.addLayer(layerGroup);
                        } else {
                            map.removeLayer(layerGroup);
                        }
                    });
                }

                if(slider) {
                    slider.addEventListener('input', (e) => {
                        const val = e.target.value / 100;
                        layerGroup.eachLayer(layer => {
                            if (layer.setStyle) {
                                // For polygons/lines
                                layer.setStyle({ fillOpacity: val, opacity: (val === 0 ? 0 : 1) });
                            }
                        });
                    });
                }
            });

            // Mobile sidebar toggles
            const sidebar = document.getElementById('sidebar');
            document.getElementById('toggle-sidebar').addEventListener('click', () => {
                sidebar.classList.toggle('-translate-x-full');
            });
            document.getElementById('close-sidebar').addEventListener('click', () => {
                sidebar.classList.add('-translate-x-full');
            });

            // Map click closes panels on mobile
            map.on('click', () => {
                attrPanel.classList.add('translate-x-[120%]');
                if(window.innerWidth < 768) sidebar.classList.add('-translate-x-full');
            });
        });
    </script>
</body>
</html>
